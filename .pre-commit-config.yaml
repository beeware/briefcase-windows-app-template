repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-case-conflict
      - id: trailing-whitespace
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.60
    hooks:
      - id: rumdl
      - id: rumdl-fmt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
